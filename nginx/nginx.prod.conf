events {}

http {

    # Дефолт nginx — 1MB, а в проекте много форм с загрузкой файлов
    # (документы заявок, закрывающие документы, документы исходящих
    # платежей, импорт .xlsx поступлений) — без этого валится 413.
    client_max_body_size 20m;

    # --------------------
    # UPSTREAMS
    # --------------------
    upstream react {
        server react:80;
    }

    upstream django {
        server django:8000;
    }

    upstream logto_core {
        server logto:3001;
    }

    upstream logto_admin {
        server logto:3002;
    }

    # --------------------
    # HTTP -> HTTPS redirect
    # --------------------
    server {
        listen 80;
        server_name app.board.fbridge.pro api.board.fbridge.pro auth.board.fbridge.pro admin.board.fbridge.pro;

        return 301 https://$host$request_uri;
    }

    # =========================
    # REACT (собранный build, отдаётся nginx'ом из react-контейнера)
    # =========================
    server {
        listen 443 ssl;
        server_name app.board.fbridge.pro;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location / {
            proxy_pass http://react;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # =========================
    # DJANGO API
    # =========================
    server {
        listen 443 ssl;
        server_name api.board.fbridge.pro;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location / {
            proxy_pass http://django;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # =========================
    # LOGTO CORE (auth)
    # =========================
    server {
        listen 443 ssl;
        server_name auth.board.fbridge.pro;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location / {
            proxy_pass http://logto_core;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # =========================
    # LOGTO ADMIN
    # =========================
    server {
        listen 443 ssl;
        server_name admin.board.fbridge.pro;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        location / {
            proxy_pass http://logto_admin;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
