server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: неизвестные пути отдаём index.html, роутинг решает react-router.
    # index.html не должен кешироваться — иначе после деплоя браузер долго
    # будет ссылаться на старые захэшированные /assets/*, которых уже нет.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Статические ассеты со стабильными хэшами в имени — кешируем надолго
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
